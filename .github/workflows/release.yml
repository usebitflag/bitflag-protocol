name: release

# Publishes an immutable release from a tag vX.Y.Z or vX.Y.Z-pre: the archive, its SHA256SUMS and release notes
# from CHANGELOG.md. Consumers pin the version and the checksum of the archive.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "The tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-pre." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME already exists. Releases are immutable; use a new version." >&2
            exit 1
          fi

      - name: Check the changelog has an entry for this version
        run: |
          grep -q "^## ${{ steps.version.outputs.version }}\b" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## ${{ steps.version.outputs.version }}' section." >&2
            exit 1
          }

      - name: Validate schemas, fixtures, vectors and Markdown
        run: |
          npm run validate
          npm run lint:md

      - name: Build the archive and checksums
        run: node tools/pack.mjs "${{ steps.version.outputs.version }}" dist

      - name: Extract the release notes
        run: |
          awk -v v="## ${{ steps.version.outputs.version }}" 'index($0, v) == 1 { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > dist/NOTES.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            dist/bitflag-protocol-${{ steps.version.outputs.version }}.tar.gz dist/SHA256SUMS \
            --title "bitflag-protocol ${{ steps.version.outputs.version }}" \
            --notes-file dist/NOTES.md \
            --verify-tag "${flags[@]}"
